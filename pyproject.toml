[project]
name = "catawiki-qa-assignment"
version = "0.1.0"
description = "Catawiki QA Automation Take-Home Assessment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytest>=7.4.0",
    "playwright>=1.40.0",
    "pytest-html>=4.1.1",
    "python-dotenv>=1.0.0",
    "pytest-json-report>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-s -v --tb=short --html=test-results/report.html --self-contained-html --json-report --json-report-file=test-results/report.json"
